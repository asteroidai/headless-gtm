# headless-ops config. Nothing runs unless it is listed here.
port: 5005

claude:
  concurrency: 2       # headless claude runs at once
  timeout_minutes: 10  # kill a run after this
  max_turns: 60

# Integrations from integrations/<name>/. Add one with: pnpm gtm add <name>
# An enabled integration with a required env var unset is disabled until you set it.
integrations:
  - cal-com

# Event -> skill. The skill reads the signal from its payload file.
on:
  cal-com.booking.created: pre-demo-brief

# Cron schedules, five fields, in the box's local time. Day-of-month and day-of-week must both match.
# A schedule runs a pull, a skill, or both.
schedules: []

# Per-integration settings, read by pulls and actions.
settings: {}
